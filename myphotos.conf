#=============UserScript=============#
# 项目名称：相册助手 (TravelAlbum) RevenueCat 解锁 — 单 App 最小化测试
# Bundle ID：qulekeji.myphotos
# 套餐目标：offerA · $rc_lifetime · product = Forever2
# 模板：sjb (终身买断)
# 配套脚本：myphotos-patch.js (放在 QX 默认脚本目录)

# 用法：
#   1. 把 myphotos-patch.js 放到 QX 的"运行脚本"目录 (iCloud Drive/Quantumult X)
#   2. 整体粘贴本文件内容到 QX profile 末尾, 或保存到 Script_X 目录后
#      在 QX → 配置 → 重写中, 通过"+"添加为本地配置文件
#   3. 启用 MitM, 重启 App 测试

# 调试：QX → 工具 → 资源解析器 校验本文件无错;
#       打开 App 后看 QX 日志, 确认抓到 GET /v1/subscribers/...
#=============UserScript=============#


[rewrite_local]
^https:\/\/api\.revenuecat\.com\/.+\/subscribers\/?(.*?)*$ url script-request-header myphotos-patch.js
^https:\/\/api\.revenuecat\.com\/.+\/subscribers\/?(.*?)*$ url script-response-body myphotos-patch.js


[mitm]
hostname = api.revenuecat.com
