#=============UserScript=============#
# 项目名称：相册助手 (TravelAlbum) RevenueCat 解锁 — 单 App 最小化测试
# Bundle ID：qulekeji.myphotos
# 套餐目标：offerA · $rc_lifetime · product = Forever2
# 模板：sjb (终身买断)
# 配套脚本：myphotos-patch.js (放在 QX 默认脚本目录)

# 用法：
#   QX → 配置 → 重写 → 右上角 + → 粘贴 raw 链接订阅本文件
#   或整段复制粘贴到 QX profile 的 [rewrite_local] / [mitm] 段尾

# 调试：QX → 工具 → 资源解析器 校验本文件无错;
#       打开 App 后看 QX 日志, 确认抓到 GET /v1/subscribers/...
#=============UserScript=============#


[rewrite_local]
# 只匹配 /subscribers/<id>  本身, 不匹配  /subscribers/<id>/offerings  /attribution  /alias 等子路径
^https:\/\/api\.revenuecat\.com\/v\d+\/subscribers\/[^\/?]+\/?(\?.*)?$ url script-request-header https://raw.githubusercontent.com/zihaveaDream/Rewrite/main/myphotos-patch.js
^https:\/\/api\.revenuecat\.com\/v\d+\/subscribers\/[^\/?]+\/?(\?.*)?$ url script-response-body https://raw.githubusercontent.com/zihaveaDream/Rewrite/main/myphotos-patch.js


[mitm]
hostname = api.revenuecat.com
