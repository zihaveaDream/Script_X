#=============UserScript=============#
# 项目名称：相册助手 (TravelAlbum) — 诊断版 (只剥 ETag, 不改 body)
# Bundle ID：qulekeji.myphotos
# 用途：定位 Error 10 来源, 区分"验签拒绝" vs "正则误伤其它端点"
# 配套脚本：myphotos-patch-diag.js

# 用法：
#   QX → 配置 → 重写 → 右上角 + → 粘贴 raw 链接订阅本文件
#   或整段复制粘贴到 QX profile 的 [rewrite_local] / [mitm] 段尾

# 调试：QX → 工具 → 资源解析器 校验本文件无错;
#       打开 App 后看 QX 日志, 确认抓到 GET /v1/subscribers/...
#=============UserScript=============#


[rewrite_local]
# 只匹配 /subscribers/<id>  本身, 不匹配  /subscribers/<id>/offerings  /attribution  /alias 等子路径
^https:\/\/api\.revenuecat\.com\/v\d+\/subscribers\/[^\/?]+\/?(\?.*)?$ url script-request-header https://raw.githubusercontent.com/zihaveaDream/Rewrite/main/myphotos-patch-diag.js
^https:\/\/api\.revenuecat\.com\/v\d+\/subscribers\/[^\/?]+\/?(\?.*)?$ url script-response-body https://raw.githubusercontent.com/zihaveaDream/Rewrite/main/myphotos-patch-diag.js


[mitm]
hostname = api.revenuecat.com
